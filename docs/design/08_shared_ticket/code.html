<style>

            width: 24px;
            height: 24px;
            background-color: theme('colors.background');
            border-radius: 50%;
        }

        .perforation::after { right: -12px; }

<span class="font-code-data text-code-data font-bold">OCT 24, 2024</span>

<div class="flex flex-col gap-unit text-right">

</div>
