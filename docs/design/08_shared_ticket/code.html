<style>
        /* Ticket styling */
        .ticket-cutout-top {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .ticket-cutout-bottom {
            clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md text-body-md antialiased flex flex-col min-h-screen">
<!-- Main Content Area (Mobile focused, centered on desktop) -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface">
<div class="w-full max-w-md flex flex-col gap-ticket-perforation">
<!-- Ticket Container -->
<div class="flex flex-col w-full relative z-10">
<!-- Top Stub (Event Info) -->
<div class="bg-deep-navy border-2 border-primary ticket-cutout-top p-6 relative">
<!-- Chip -->
<div class="inline-block border-2 border-primary-container px-2 py-1 mb-4">
<span class="font-label-caps text-label-caps text-primary-container uppercase">VIP Admission</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary uppercase mb-2">Midnight Syndicate</h1>
<p class="font-subheading text-subheading text-on-surface-variant mb-6">Warehouse 21 • Brooklyn, NY</p>
<div class="grid grid-cols-2 gap-4 border-t-2 border-dashed border-outline-variant pt-4">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Date</p>
<p class="font-data-mono text-data-mono text-on-surface">OCT 31, 2024</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1">Time</p>
<p class="font-data-mono text-data-mono text-on-surface">11:00 PM</p>
</div>
</div>
</div>
<!-- Bottom Stub (QR & Specifics) -->
<div class="bg-surface-container border-2 border-t-0 border-outline-variant ticket-cutout-bottom p-6 flex flex-col items-center border-t-2 border-dashed border-outline-variant relative mt-[-2px]">
<!-- Data Grid -->
<div class="w-full grid grid-cols-3 gap-2 mb-6 text-center border-b-2 border-outline-variant pb-4">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Sec</p>
<p class="font-data-mono text-data-mono text-primary">GA1</p>
</div>
<div class="border-l-2 border-r-2 border-outline-variant">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Row</p>
<p class="font-data-mono text-data-mono text-primary">-</p>
</div>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Seat</p>
<p class="font-data-mono text-data-mono text-primary">-</p>
</div>
</div>
<!-- QR Code Area -->
<div class="w-48 h-48 bg-white p-2 mb-4">
<img class="w-full h-full object-cover" data-alt="A highly detailed close-up of a crisp, stark black and white QR code printed on slightly textured premium matte paper. The lighting is bright and direct, highlighting the stark contrast. The aesthetic is modern, brutalist, and functional, sitting on a dark surface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyb-KdzC2UchFgLIsLMlo0ncdOkrpFQBPNTV9YPwBV2lCEYWRpPffCqJwwhJjAgTnpEOaudjV69pnBhEurotmEAqQiSJcl6Do7QkKzKvGES8Ge8JeLWZW1x-sF-VCSqGF1YF1RkIVFSWGJaHlZZ8VkNHFT7mGX4sOyi2WE8-hoqSWvgQC0kIZgV7mXeIIIBBOMWXds5Wiu4N7n2WAAAatb8gUw82FPHS5tPzKnM3wHHvFsS_le"/>
</div>
<p class="font-data-mono text-data-mono text-on-surface-variant text-center tracking-widest">TK-982-451-09A</p>
<p class="mt-4 text-center font-label-caps text-label-caps text-on-surface-variant">Shared by Alex M.</p>
</div>
</div>
<!-- CTA Section -->
<div class="mt-8 text-center flex flex-col items-center gap-4">
<p class="font-subheading text-subheading text-on-surface">Want to join the event?</p>
<button class="w-full bg-primary-container text-black font-label-caps text-label-caps uppercase py-4 px-6 hover:bg-primary-fixed-dim transition-colors border-2 border-transparent active:border-white">
                    Get Your Own Ticket
                </button>
<div class="flex items-center gap-2 mt-4 text-on-surface-variant">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tighter" style="font-size: 24px; line-height: 28px;">EliteTickets</span>
</div>
</div>
</div>
</main>
