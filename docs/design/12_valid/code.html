<span class="material-symbols-outlined">qr_code_scanner</span>

<script>
        function resetScan() {
            // In a real app, this would reset the camera/scanner state
            const btn = document.querySelector('button');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> SCANNING...';
            setTimeout(() => {
                // Simulate returning to scan mode or loading next view
                btn.innerHTML = '<span class="material-symbols-outlined">qr_code_scanner</span> NEXT SCAN';
            }, 500);
        }
    </script>
