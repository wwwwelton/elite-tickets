<style>
        .perforated-edge {
            background-image: radial-gradient(circle, #1D1D1B 4px, transparent 4px);
            background-size: 16px 16px;
            background-position: -8px 0;
            background-repeat: repeat-y;
        }
        
        @keyframes pulse-border {
            0% { border-color: #34C759; box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.4); }
            50% { border-color: #64D380; box-shadow: 0 0 0 10px rgba(52, 199, 89, 0); }
            100% { border-color: #34C759; box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }
        
        .pulse-border-valid {
            animation: pulse-border 2s infinite;
        }
      </style>
</head>
<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex flex-col font-body-md">
<!-- Top Navigation (Shell suppressed for this full-screen validation transactional screen, but retaining a minimal header for context) -->
<header class="w-full flex justify-between items-center p-gutter md:px-margin-desktop z-50 absolute top-0">
<div class="font-headline-lg-mobile md:font-headline-lg text-primary uppercase tracking-tighter">
            EliteTickets Gate
        </div>
<div class="text-on-surface-variant font-label-caps text-label-caps flex items-center gap-2 border border-outline-variant px-3 py-1 bg-surface/50 backdrop-blur-sm">
<span class="material-symbols-outlined" style="font-size: 16px;">wifi</span> Online
        </div>
</header>
<!-- Main Validation Canvas -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop relative z-10 pt-20 pb-24">
<!-- Validation Result Header -->
<div class="text-center mb-8 flex flex-col items-center">
<div class="w-24 h-24 rounded-full bg-ticket-valid/20 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[64px] text-ticket-valid" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-display-xl text-display-xl text-ticket-valid uppercase">VALID</h1>
<p class="font-subheading text-subheading text-on-surface-variant mt-2">ENTRY APPROVED</p>
</div>
<!-- Ticket Info Card -->
<div class="w-full max-w-md bg-deep-navy border-4 border-ticket-valid pulse-border-valid relative flex flex-col">
<!-- Cutouts for stencil effect -->
<div class="absolute -left-[18px] top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-background border-r-4 border-ticket-valid"></div>
<div class="absolute -right-[18px] top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-background border-l-4 border-ticket-valid"></div>
<!-- Top Stub (Event Info) -->
<div class="p-6 border-b-2 border-dashed border-outline-variant pb-8">
<div class="flex justify-between items-start mb-4">
<div>
<div class="font-label-caps text-label-caps text-primary mb-1 uppercase">Event</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface uppercase leading-none">Midnight Circus Tour</h2>
</div>
<div class="bg-surface border border-outline-variant px-2 py-1 flex items-center gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">VIP</span>
</div>
</div>
<div class="flex gap-4">
<div>
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Date</div>
<div class="font-data-mono text-data-mono text-on-surface">OCT 24, 2024</div>
</div>
<div>
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Time</div>
<div class="font-data-mono text-data-mono text-on-surface">22:00</div>
</div>
</div>
</div>
<!-- Bottom Body (Holder Info) -->
<div class="p-6 pt-8 bg-surface-container-high/50">
<div class="grid grid-cols-2 gap-6 mb-6">
<div>
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Holder Name</div>
<div class="font-subheading text-subheading text-on-surface uppercase truncate" title="Alexander Sterling">Alexander Sterling</div>
</div>
<div>
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Ticket ID</div>
<div class="font-data-mono text-data-mono text-primary">#MC-88942-X</div>
</div>
</div>
<!-- Seat Coordinates (High Contrast Data) -->
<div class="bg-background border border-outline-variant p-4 flex justify-between">
<div class="text-center">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1">SECTION</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">FLR</div>
</div>
<div class="w-px bg-outline-variant"></div>
<div class="text-center">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1">ROW</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">A</div>
</div>
<div class="w-px bg-outline-variant"></div>
<div class="text-center">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-1">SEAT</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary">12</div>
</div>
</div>
</div>
</div>
</main>
<!-- Action Area (Fixed Bottom) -->
<div class="fixed bottom-0 w-full p-margin-mobile md:p-margin-desktop bg-gradient-to-t from-background via-background to-transparent z-50 flex justify-center">
<button class="w-full max-w-md bg-primary-container text-black font-headline-lg-mobile text-headline-lg-mobile uppercase py-4 flex justify-center items-center gap-2 hover:bg-[#d8a816] active:scale-95 transition-all duration-150 border-2 border-primary-container hover:border-[#d8a816]" onclick="location.reload()">
<span class="material-symbols-outlined text-[32px]">qr_code_scanner</span>
            Scan Next
        </button>
</div>
