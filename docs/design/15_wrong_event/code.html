<style>

        .perforation::before, .perforation::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 20px;
            height: 20px;
            background-color: theme('colors.background');
            border-radius: 50%;
            border: 1px solid theme('colors.on-surface');
