<style>
        body {
            background-color: #131313;
            color: #e2e2e2;
        }
        
        .ticket-perforation {
            border-top: 1px dashed white;
        }

        .input-underline {
            background: transparent;
            border: none;
            border-bottom: 1px solid white;
            border-radius: 0;
            padding: 8px 0;
            color: white;
        }
        
        .input-underline:focus {
            outline: none;
            border-bottom: 2px solid #ffb4aa;
            box-shadow: none;
        }

        .input-underline::placeholder {
            color: #b4b5b5;
        }
        
        .btn-primary {
            background-color: #c0000b;
            color: white;
            border: none;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #93000a;
        }
        
        .btn-ghost {
            background: transparent;
            border: 1px solid white;
            color: white;
            transition: all 0.2s ease;
        }
        
        .btn-ghost:hover {
            background: white;
            color: black;
        }

<body class="bg-background text-on-surface antialiased font-body-md h-screen overflow-hidden flex">
<!-- SideNavBar -->
<nav class="bg-background dark:bg-background text-primary dark:text-primary border-r-2 border-primary dark:border-primary hidden md:flex flex-col h-screen p-6 fixed left-0 top-0 overflow-y-auto docked left-0 h-full w-64 z-50">
<div class="font-display-lg text-display-lg text-primary dark:text-primary leading-none mb-8">ELITE TICKETS</div>
<div class="font-label-caps text-label-caps text-on-surface mb-8">ORGANIZER PORTAL</div>
<ul class="flex flex-col gap-2 flex-grow font-headline-sm text-headline-sm">
<li class="">
<a class="text-on-surface dark:text-on-surface px-4 py-3 flex items-center gap-3 hover:bg-white hover:text-black transition-all duration-75" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                    Dashboard
                </a>
</li>
<li class="">
<a class="text-on-surface dark:text-on-surface px-4 py-3 flex items-center gap-3 hover:bg-white hover:text-black transition-all duration-75" href="#">
<span class="material-symbols-outlined" data-icon="event">event</span>
                    My Events
                </a>
</li>
<li class="">
<a class="text-on-surface dark:text-on-surface px-4 py-3 flex items-center gap-3 hover:bg-white hover:text-black transition-all duration-75" href="#">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
                    Scan Tickets
                </a>
</li>
<li class="">
<a class="text-on-surface dark:text-on-surface px-4 py-3 flex items-center gap-3 hover:bg-white hover:text-black transition-all duration-75" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                    Settings
                </a>
</li>
</ul>
<div class="mt-auto pt-8 border-t border-secondary-container">
<button class="w-full btn-primary font-label-caps text-label-caps py-4 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
                Create Event
            </button>
</div>
</nav>
<!-- Main Canvas -->
<main class="ml-0 md:ml-64 flex-1 h-screen overflow-y-auto bg-surface-container-low p-margin-mobile md:p-margin-desktop relative">
<!-- Header -->
<header class="mb-stack-xl flex justify-between items-end border-b border-surface-container-highest pb-stack-sm">
<div>
<h1 class="font-headline-md text-headline-md text-white">CREATE EVENT</h1>
<p class="font-code-data text-code-data text-on-surface-variant mt-2">SYS_ID: <span class="text-primary">EVT-NEW-9932</span></p>
</div>
<div class="hidden md:flex gap-4">
<button class="btn-ghost font-label-caps text-label-caps px-6 py-3">SAVE DRAFT</button>
<button class="btn-primary font-label-caps text-label-caps px-6 py-3">PUBLISH EVENT</button>
</div>
</header>
<!-- Form Layout -->
<div class="max-w-4xl mx-auto">
<form class="space-y-stack-lg">
<!-- Section 1: Film Identification -->
<div class="border border-white p-6 bg-surface relative">
<div class="absolute top-0 right-0 p-2 bg-white text-black font-label-caps text-label-caps">01 / IDENTITY</div>
<div class="space-y-6 mt-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">SEARCH CATALOG</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-2 text-on-secondary-container">search</span>
<input class="input-underline font-code-data text-code-data w-full pl-8" placeholder="ENTER FILM TITLE OR IMDB ID..." type="text">
</div>
</div>
<!-- Manual Entry Fallback Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mt-8 pt-8 ticket-perforation">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">MANUAL TITLE</label>
<input class="input-underline font-code-data text-code-data w-full" placeholder="FILM NAME" type="text">
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">DIRECTOR</label>
<input class="input-underline font-code-data text-code-data w-full" placeholder="DIRECTOR NAME" type="text">
</div>
</div>
</div>
</div>
<!-- Section 2: Temporal Logistics -->
<div class="border border-white p-6 bg-surface relative">
<div class="absolute top-0 right-0 p-2 bg-white text-black font-label-caps text-label-caps">02 / LOGISTICS</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter mt-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">DATE</label>
<input class="input-underline font-code-data text-code-data w-full" style="color-scheme: dark;" type="date">
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">TIME</label>
<input class="input-underline font-code-data text-code-data w-full" style="color-scheme: dark;" type="time">
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">RUNTIME (MIN)</label>
<input class="input-underline font-code-data text-code-data w-full" placeholder="120" type="number">
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mt-8 pt-8 ticket-perforation">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">VENUE / THEATER</label>
<select class="input-underline font-code-data text-code-data w-full bg-surface" style="color-scheme: dark;">
<option>MAIN HALL - THE ROXY</option>
<option>SCREEN 1 - INDIE HOUSE</option>
<option>SCREEN 2 - INDIE HOUSE</option>
<option>OUTDOOR AMPHITHEATER</option>
</select>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">SEATING TYPE</label>
<select class="input-underline font-code-data text-code-data w-full bg-surface" style="color-scheme: dark;">
<option>GENERAL ADMISSION</option>
<option>ASSIGNED SEATING</option>
</select>
</div>
</div>
</div>
<!-- Section 3: Economics -->
<div class="border border-white p-6 bg-surface relative">
<div class="absolute top-0 right-0 p-2 bg-white text-black font-label-caps text-label-caps">03 / ECONOMICS</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mt-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">CAPACITY</label>
<input class="input-underline font-code-data text-code-data w-full" placeholder="250" type="number">
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-2">PRICE PER TICKET (USD)</label>
<div class="relative">
<span class="absolute left-0 top-2 font-code-data text-code-data text-on-secondary-container">$</span>
<input class="input-underline font-code-data text-code-data w-full pl-6" placeholder="15.00" step="0.01" type="number">
</div>
</div>
</div>
</div>
<!-- Mobile Action Area -->
<div class="md:hidden flex flex-col gap-4 mt-8 pt-8 border-t border-surface-container-highest">
<button class="btn-ghost font-label-caps text-label-caps px-6 py-4 w-full">SAVE DRAFT</button>
<button class="btn-primary font-label-caps text-label-caps px-6 py-4 w-full">PUBLISH EVENT</button>
</div>
</form>
</div>
</main>


</body></html>
