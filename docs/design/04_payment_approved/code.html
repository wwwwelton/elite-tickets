<style>
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before,
        .ticket-cutout::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #121414; /* Match background */
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            border: 2px solid #ffebc0; /* Match primary */
        }
        .ticket-cutout::before {
            left: -12px;
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
        }
        .ticket-cutout::after {
            right: -12px;
            clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop">
<!-- Suppressed TopAppBar and BottomNavBar as per Transactional/Success intent -->
<main class="w-full max-w-2xl mx-auto flex flex-col gap-8 items-center text-center">
<!-- Animated Success Icon Placeholder (Using a generic visual cue for high-end brutalist aesthetic) -->
<div class="relative w-48 h-48 flex items-center justify-center bg-primary-container text-on-primary-container rounded-full border-4 border-primary">
<span class="material-symbols-outlined text-[96px]" style="font-variation-settings: 'FILL' 1;">
                check_circle
            </span>
<!-- Decorative concentric circles -->
<div class="absolute inset-0 rounded-full border border-primary opacity-50 animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<div class="absolute inset-[-20px] rounded-full border border-primary opacity-20"></div>
</div>
<div class="space-y-2">
<h1 class="font-display-xl text-display-xl text-primary uppercase tracking-tighter hidden md:block">Payment Approved</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tighter md:hidden">Payment Approved</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">Your transaction was successful. You're officially on the list.</p>
</div>
<!-- Receipt Ticket Graphic -->
<div class="w-full bg-deep-navy border-2 border-primary relative mt-8 flex flex-col">
<!-- Stub Header -->
<div class="p-6 border-b-2 border-dashed border-primary flex justify-between items-center bg-surface-container-high">
<div class="text-left">
<span class="font-label-caps text-label-caps text-primary uppercase block mb-1">Order #</span>
<span class="font-data-mono text-data-mono text-on-surface">ET-9824-XVY</span>
</div>
<div class="text-right">
<span class="font-label-caps text-label-caps text-primary uppercase block mb-1">Status</span>
<span class="font-label-caps text-label-caps text-ticket-valid px-2 py-1 border border-ticket-valid">PAID IN FULL</span>
</div>
</div>
<!-- Ticket Body -->
<div class="p-6 ticket-cutout">
<div class="space-y-4 text-left">
<div class="flex justify-between items-end border-b border-outline-variant pb-2">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Event</span>
<span class="font-subheading text-subheading text-on-surface">Midnight Syndicate: Live</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$120.00</span>
</div>
<div class="flex justify-between items-end border-b border-outline-variant pb-2">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Fees</span>
<span class="font-body-md text-body-md text-on-surface">Service &amp; Processing</span>
</div>
<span class="font-data-mono text-data-mono text-on-surface">$15.50</span>
</div>
<div class="flex justify-between items-end pt-4">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase">Total</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">$135.50</span>
</div>
</div>
<div class="mt-8 flex justify-between items-center bg-surface p-4 border border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">credit_card</span>
<span class="font-data-mono text-data-mono text-on-surface">**** **** **** 4242</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">08/24</span>
</div>
</div>
</div>
