</div>
<div>

<button class="flex items-center justify-center h-10 w-10 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
</header>

<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-24 pb-10">
<div class="w-full max-w-md">
<!-- Error State Card (Ticket Style) -->
<div class="bg-surface-container brutalist-error-border relative flex flex-col">

<div class="absolute -left-3 top-1/2 w-6 h-6 bg-background rounded-full border-r-2 border-ticket-void -translate-y-1/2 z-10"></div>
<div class="absolute -right-3 top-1/2 w-6 h-6 bg-background rounded-full border-l-2 border-ticket-void -translate-y-1/2 z-10"></div>

<div class="p-6 flex flex-col items-center text-center dashed-divider pb-8 pt-10">
<span class="material-symbols-outlined text-6xl text-ticket-void mb-4" style="font-variation-settings: 'FILL' 0;">error</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-ticket-void uppercase tracking-tight mb-2">Payment Declined</h1>
<div class="inline-block bg-ticket-void text-black font-label-caps text-label-caps px-2 py-1 brutalist-error-border mt-2">
                        TRANSACTION FAILED
                    </div>
</div>
<!-- Body / Details -->
<div class="p-6 flex flex-col gap-6">
<div class="flex flex-col items-center text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-1">Reason for failure:</p>
<p class="font-subheading text-subheading text-on-surface">Insufficient funds in the selected account.</p>
</div>
<!-- Technical Details (data-mono) -->
<div class="bg-surface p-4 border border-outline-variant mt-2">
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">Order ID</span>
<span class="font-data-mono text-data-mono text-on-surface">#ET-8842-VOID</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">Timestamp</span>
<span class="font-data-mono text-data-mono text-on-surface">2023-10-27 14:03 UTC</span>
</div>
</div>
</div>
</div>

<button class="w-full bg-primary-container text-black font-headline-lg-mobile text-2xl py-4 brutalist-border uppercase tracking-tight hover:bg-primary-fixed-dim transition-colors active:scale-95 duration-100 flex justify-center items-center gap-2">
<span class="material-symbols-outlined">refresh</span>
