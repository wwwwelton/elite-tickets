<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .ticket-cutout-left {
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background-color: theme('colors.background');
            border-radius: 50%;
            border-right: 2px solid theme('colors.primary');
            z-index: 10;
        }
        .ticket-cutout-right {
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background-color: theme('colors.background');
            border-radius: 50%;
            border-left: 2px solid theme('colors.primary');
            z-index: 10;
        }
        .ticket-dashed-line {
            border-top: 2px dashed theme('colors.primary');
            margin-top: -1px;
            opacity: 0.5;
        }
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col pt-16">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background border-b-2 border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 z-50">
<button class="text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary uppercase tracking-tighter">
            EliteTickets
        </div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<img class="object-cover w-full h-full" data-alt="A small, stylized profile avatar of a user. The avatar is a high-contrast black and white illustration of a face with bold shadows, fitting the brutalist aesthetic of the site. It is set against a dark background, reflecting the overall dark mode theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCC60ndJAUnD6L88ySe_IMveFzXJWFVrUtY-LDMgBH9b_34g18705GZscFSejd6WqQm-ZrEc70xU5rK6cCi6MHnFnZiTeL2ZS0j6wrKn-pRbTnwCT2AZ5YvZ8RCVKEb5lT_FmPmfXumuTJQP6E59-tfkge0PyJphcPFUJtybXAQgmPU2NnxUYp4sFRwmw-FSMUreWPnEisCsqo9WWI_f4BLrj5ZXTs0lQpw-ciYCI1_JlG4ljs"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start px-margin-mobile py-8 md:py-margin-desktop md:px-margin-desktop w-full max-w-lg mx-auto">
<!-- Ticket Container -->
<div class="w-full relative bg-deep-navy border-2 border-primary flex flex-col rounded-DEFAULT shadow-2xl">
<!-- Cutouts for perforation effect -->
<div class="ticket-cutout-left hidden md:block"></div>
<div class="ticket-cutout-right hidden md:block"></div>
<!-- Stub/Header Section -->
<div class="p-6 flex flex-col items-center justify-center border-b border-primary border-opacity-20 relative">
<span class="font-label-caps text-label-caps text-primary border border-primary px-2 py-1 mb-4">ADMIT ONE</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center mb-2 uppercase tracking-wide">DUNE: PART TWO</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">IMAX 70MM PRESENTATION</p>
</div>
<!-- The Dashed Line -->
<div class="w-full relative h-0">
<div class="absolute inset-0 ticket-dashed-line mx-4"></div>
</div>
<!-- Info Section -->
<div class="p-6 flex flex-col gap-6">
<!-- Time & Venue -->
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant">DATE &amp; TIME</span>
<span class="font-data-mono text-data-mono text-on-surface">FRI, MAR 15 • 8:00 PM</span>
</div>
<div class="flex flex-col gap-1 text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant">VENUE</span>
<span class="font-data-mono text-data-mono text-on-surface">AMC LINCOLN SQ</span>
</div>
</div>
<!-- Seat Details Grid -->
<div class="grid grid-cols-3 gap-4 border-t border-b border-outline-variant py-4">
<div class="flex flex-col items-center justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">SEC</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">ORC</span>
</div>
<div class="flex flex-col items-center justify-center border-l border-r border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">ROW</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">G</span>
</div>
<div class="flex flex-col items-center justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">SEAT</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">14</span>
</div>
</div>
<!-- QR Code Area -->
<div class="flex flex-col items-center justify-center py-4">
<div class="bg-white p-4 rounded-sm border-4 border-white mb-2">
<img class="w-48 h-48 object-cover" data-alt="A high-contrast, black and white QR code. The QR code is complex and dense, centered perfectly on a pure white background. It is designed to look like a functional, scannable digital ticket element within a brutalist user interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjhXO4qwNiLlaUnMgIoUjX7IJC15HajUqQ-3nLqZapIIUw_uqAlQneK01k4ffAeioPnM0s45_FueLThL0EJ55zlWp9qKGXe9X9aYeWN7kozD-O9sXCLPGv7FC2Yy6L4TILljVbgqpAer_FYpz00eOUFRx0vuIndiIcV_Virr4P75P7-lsw6HcJa-Yi7DtzpRGyy2Jh2DJCmEJq9AjusC5bLUg9BIQpPumpHRPsa09NnGe649Du"/>
</div>
<span class="font-data-mono text-data-mono text-on-surface-variant text-xs opacity-70">TKT-8934-XV-001</span>
</div>
<!-- Status Badge -->
<div class="flex justify-center mt-2">
<div class="border-2 border-ticket-valid text-ticket-valid font-headline-lg text-headline-lg px-6 py-2 uppercase tracking-widest transform -rotate-3 opacity-90 mix-blend-screen">
                        VALID
                    </div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full mt-8 flex flex-col gap-4">
<button class="w-full bg-primary-container text-black font-subheading text-subheading py-4 flex items-center justify-center gap-2 hover:bg-primary-fixed-dim transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
                SAVE TO WALLET
            </button>
<button class="w-full bg-transparent border-2 border-white text-white font-subheading text-subheading py-4 flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="share">share</span>
                SHARE TICKET
            </button>
</div>
</main>
</body></html>
