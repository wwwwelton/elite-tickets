<!DOCTYPE html>

<style>
        .perforated-edge {
            position: relative;
        }
        .perforated-edge::before, .perforated-edge::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 24px;
            height: 24px;
            background-color: theme('colors.background');
            border-radius: 50%;
            z-index: 10;
        }
        .perforated-edge::before {
            left: -12px;
        }
        .perforated-edge::after {
            right: -12px;
        }
        
        .ticket-cutout {
            position: relative;
            background: theme('colors.surface');
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.background'); 
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.surface-variant'); 
            border: 1px solid theme('colors.background');
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.secondary-container'); 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 sticky top-0 z-50 bg-background border-b-2 border-primary">
<div class="flex items-center gap-4">
<a class="hidden md:flex flex-col group" href="#">
<span class="material-symbols-outlined text-primary group-hover:text-white transition-colors" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg uppercase tracking-tighter text-primary leading-none">ELITE TICKETS</h1>
</div>
<div class="flex items-center gap-4">
<button aria-label="Account" class="p-2 text-primary hover:bg-primary hover:text-on-primary transition-colors duration-100 transform active:scale-95">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</div>
</header>
<div class="flex flex-1 w-full relative">
<!-- Main Content Area -->
<main class="flex-1 flex justify-center items-start pt-stack-xl pb-32 px-margin-mobile overflow-y-auto">
<div class="w-full max-w-md flex flex-col gap-stack-lg">
<!-- Back button for mobile -->
<a class="md:hidden flex items-center gap-2 text-secondary hover:text-white transition-colors w-fit" href="#">
<span class="material-symbols-outlined text-xl" data-icon="arrow_back">arrow_back</span>
<span class="font-label-caps text-label-caps uppercase">Back to Tickets</span>
</a>
<!-- Ticket Container -->
<article class="ticket-cutout w-full border-2 border-surface-variant flex flex-col relative overflow-hidden bg-white text-black shadow-[0_0_0_1px_rgba(255,255,255,0.1)]">
<!-- Top Section: Poster & Title -->
<div class="relative w-full h-[400px] bg-black border-b-2 border-dashed border-black">
<div class="absolute inset-0 bg-cover bg-center opacity-80 mix-blend-luminosity grayscale contrast-125" data-alt="A highly detailed cinematic poster for a neo-noir film. A solitary figure stands under a harsh, flickering streetlamp in a rain-slicked metropolis. The lighting is extremely dramatic, with high contrast absolute blacks and piercing white highlights, accented by intense, saturated cinema red reflections in the puddles. The composition is brutalist, stark, and exclusive, evoking a premium physical artifact." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC5BEwffyiQhUjAufTFOKyvdFvVmJMES4tGX8SkU6jnjS7L5T454bj1vjpkNdcjXFn2jQJQgRvF8i7f6xNxRZ67WxbH3TEm0_8ZDAbxg08tAm6lCZgzghlSlQLJWAeZuvZvaprcfyd3PqDmlL0N59nE35rqQRO3U4YVhvJ5CBgiRPfNcCZV-Z4Gx9SnN91JXjY8MGtP15Rx5px9EMC2i7M1bncS6F7ZPiIlAlIzFL-Zp96bylTQLh6PGA')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
<div class="absolute bottom-0 left-0 w-full p-6 flex flex-col gap-2">
<span class="font-label-caps text-label-caps text-primary border border-primary px-2 py-1 w-fit bg-black/50 backdrop-blur-sm uppercase">Admit One</span>
<h2 class="font-headline-md text-headline-md text-white uppercase leading-tight tracking-tight">The Midnight<br/>Protocol</h2>
</div>
</div>
<!-- Middle Section: Event Details (Perforated) -->
<div class="perforated-edge border-t-2 border-dashed border-surface-variant bg-white p-6 flex flex-col gap-6">
<!-- Grid Details -->
<div class="grid grid-cols-2 gap-y-6 gap-x-4">
<div class="flex flex-col border-l-2 border-black pl-3">
<span class="font-label-caps text-label-caps text-surface-variant uppercase mb-1">Date</span>
<span class="font-code-data text-code-data text-black font-bold">OCT 24, 2024</span>
</div>
<div class="flex flex-col border-l-2 border-black pl-3">
<span class="font-label-caps text-label-caps text-surface-variant uppercase mb-1">Time</span>
<span class="font-code-data text-code-data text-black font-bold">21:30 EST</span>
</div>
<div class="flex flex-col border-l-2 border-black pl-3 col-span-2">
<span class="font-label-caps text-label-caps text-surface-variant uppercase mb-1">Venue</span>
<span class="font-body-md text-body-md text-black font-bold uppercase">The Grand Rex Cinema, Studio 1</span>
</div>
<div class="flex flex-col border-l-2 border-black pl-3">
<span class="font-label-caps text-label-caps text-surface-variant uppercase mb-1">Row</span>
<span class="font-headline-sm text-headline-sm text-black">G</span>
</div>
<div class="flex flex-col border-l-2 border-black pl-3">
<span class="font-label-caps text-label-caps text-surface-variant uppercase mb-1">Seat</span>
<span class="font-headline-sm text-headline-sm text-black">14</span>
</div>
</div>
</div>
<!-- Bottom Section: QR Code & Actions -->
<div class="perforated-edge border-t-2 border-dashed border-surface-variant bg-white p-6 flex flex-col items-center gap-6">
<div class="w-full max-w-[200px] aspect-square bg-white border-4 border-black p-2 flex items-center justify-center relative">
<!-- Placeholder for QR Code, stylized -->
<div class="w-full h-full border border-black p-1 flex flex-wrap gap-1 content-start">
<!-- Fake QR code pattern blocks -->
<div class="w-8 h-8 border-4 border-black"></div>
<div class="flex-1 h-8 bg-black"></div>
<div class="w-8 h-8 border-4 border-black"></div>
<div class="w-full h-4 bg-black/80"></div>
<div class="w-1/2 h-4 bg-black/60"></div>
<div class="w-1/3 h-4 bg-black"></div>
<div class="w-8 h-8 border-4 border-black mt-auto"></div>
<div class="flex-1 h-8 bg-black mt-auto"></div>
<div class="w-8 h-8 bg-black mt-auto"></div>
</div>
</div>
<div class="flex flex-col items-center w-full">
<span class="font-label-caps text-label-caps text-surface-variant uppercase mb-2">Ticket Code</span>
<span class="font-code-data text-code-data text-black text-lg tracking-[0.2em]">ELT-889-MX-14</span>
</div>
</div>
</article>
<!-- Actions -->
<div class="flex flex-col gap-4 w-full mt-4">
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps uppercase py-4 px-6 hover:bg-white hover:text-black transition-colors duration-150 flex items-center justify-center gap-3 border-2 border-transparent hover:border-black active:scale-[0.98]">
<span class="material-symbols-outlined text-xl" data-icon="ios_share">ios_share</span>
                        Share Ticket
                    </button>
<button class="w-full bg-transparent text-white font-label-caps text-label-caps uppercase py-4 px-6 border border-white hover:bg-white hover:text-black transition-colors duration-150 flex items-center justify-center gap-3 active:scale-[0.98]">
<span class="material-symbols-outlined text-xl" data-icon="add_to_drive">add_to_drive</span>
                        Add to Wallet
                    </button>
</div>
</div>
</main>
</div>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-stretch h-16 bg-background border-t-2 border-primary">
<a class="flex flex-col items-center justify-center text-on-surface p-2 w-full h-full hover:bg-primary-container hover:text-on-primary-container transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="search" style="font-variation-settings: 'FILL' 0;">search</span>
<span class="font-label-caps text-label-caps uppercase">Browse</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary p-2 w-full h-full transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="confirmation_number" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
<span class="font-label-caps text-label-caps uppercase font-bold">Tickets</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface p-2 w-full h-full hover:bg-primary-container hover:text-on-primary-container transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-label-caps uppercase">Profile</span>
</a>
</nav>
</body></html>
