<style>
        .ticket-error-pulse {
            animation: errorPulse 2s infinite;
        }
        @keyframes errorPulse {
            0% { background-color: rgba(255, 59, 48, 0.1); }
            50% { background-color: rgba(255, 59, 48, 0.2); }
            100% { background-color: rgba(255, 59, 48, 0.1); }
        }
        .stencil-border {
            border: 4px solid #FF3B30;
            position: relative;
        }
        .stencil-border::before, .stencil-border::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #121414; /* Match body background */
            border: 4px solid #FF3B30;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }
        .stencil-border::before {
            left: -16px;
            border-right-color: transparent;
            border-top-color: transparent;
            border-bottom-color: transparent;
        }
        .stencil-border::after {
            right: -16px;
            border-left-color: transparent;
            border-top-color: transparent;
            border-bottom-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile overflow-hidden ticket-error-pulse">
<!-- Top Navigation Placeholder (Hidden for transactional screen, but keeps structure if needed) -->
<!-- Nav components suppressed as this is a linear/transactional gate check result -->
<!-- Main Content Canvas -->
<main class="w-full max-w-md flex flex-col items-center justify-center relative z-10 space-y-8">
<!-- Error Status Container -->
<div class="flex flex-col items-center text-center space-y-4">
<span class="material-symbols-outlined text-[120px] text-ticket-void" style="font-variation-settings: 'FILL' 1;">
                error
            </span>
<h1 class="font-display-xl text-display-xl text-ticket-void uppercase tracking-tighter">
                INVALID
            </h1>
</div>
<!-- Details Card -->
<div class="w-full bg-surface-container stencil-border p-8 flex flex-col items-center space-y-6 opacity-90">
<div class="flex flex-col items-center space-y-2 text-center w-full">
<span class="font-label-caps text-label-caps text-error uppercase">Error Code: E-404</span>
<h2 class="font-subheading text-subheading text-on-surface">Ticket Not Found</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                    This QR code is not recognized in the current event database. Please verify the ticket or direct attendee to the box office.
                </p>
</div>
<!-- Stub Divider -->
<div class="w-full border-t-2 border-dashed border-outline-variant my-4 relative"></div>
<!-- Tech Details -->
<div class="w-full grid grid-cols-2 gap-4 text-center">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">Gate</span>
<span class="font-data-mono text-data-mono text-on-surface">MAIN-01</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">Time</span>
<span class="font-data-mono text-data-mono text-on-surface" id="currentTime">19:42:05</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-black font-label-caps text-label-caps uppercase py-6 px-4 hover:bg-primary-fixed-dim transition-colors border-2 border-primary-container active:scale-95 duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
            Back to Scanner
        </button>
<!-- Secondary Action -->
<button class="w-full bg-transparent text-on-surface font-label-caps text-label-caps uppercase py-4 px-4 hover:bg-surface-container-high transition-colors border-2 border-on-surface active:scale-95 duration-100 mt-4">
            Manual Entry
        </button>
</main>
<script>
        // Update time dynamically to look like a live system
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('currentTime').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body></html>
