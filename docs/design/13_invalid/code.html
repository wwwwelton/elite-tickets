<style>
        /* Editorial Brutalist Additions */
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before,
        .ticket-cutout::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: theme('colors.background');
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        .ticket-cutout::before {
            left: -12px;
        }
        .ticket-cutout::after {
            right: -12px;
        }
        
        .perforation-line {
            border-top: 2px dashed theme('colors.inverse-surface');
        }
        
        /* Glitch effect for invalid state */
        .glitch-effect {
            animation: glitch 1s linear infinite;
        }
        
        @keyframes glitch {
            2%, 64% { transform: translate(2px,0) skew(0deg); }
            4%, 60% { transform: translate(-2px,0) skew(0deg); }
            62% { transform: translate(0,0) skew(5deg); }
        }
    </style>
</head>
<body class="min-h-screen w-full overflow-hidden flex flex-col bg-error-container relative">
<!-- Intense Red/Black Background Gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-error-container via-background to-error-container opacity-80 mix-blend-multiply pointer-events-none z-0"></div>
<!-- Main Content Canvas (Suppressed Navigation per instructions) -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative z-10 w-full max-w-4xl mx-auto h-screen">
<!-- The "Ticket" Container - Invalid State -->
<div class="w-full max-w-2xl bg-surface border-2 border-primary relative flex flex-col ticket-cutout shadow-2xl transform transition-transform duration-300 hover:scale-[1.01]">
<!-- Top Section: Status Icon & Title -->
<div class="p-stack-lg flex flex-col items-center text-center">
<div class="mb-stack-md relative glitch-effect">
<span class="material-symbols-outlined text-[80px] md:text-[120px] text-primary" data-icon="error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary uppercase tracking-tighter mb-stack-sm">
                    INVALID
                </h1>
<p class="font-headline-sm text-headline-sm text-on-surface opacity-80 uppercase tracking-widest">
                    Code Not Recognized
                </p>
</div>
<!-- Perforation Divider -->
<div class="w-full perforation-line relative h-0"></div>
<!-- Bottom Section: Details & Action -->
<div class="p-stack-lg flex flex-col gap-stack-lg bg-surface-container-low">
<!-- Data Grid -->
<div class="grid grid-cols-2 gap-stack-md border-b-2 border-primary pb-stack-md border-dashed">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface opacity-60 mb-unit">SCANNED AT</span>
<span class="font-code-data text-code-data text-primary">20:45:12 PST</span>
</div>
<div class="flex flex-col text-right">
<span class="font-label-caps text-label-caps text-on-surface opacity-60 mb-unit">GATE</span>
<span class="font-code-data text-code-data text-primary">04 - NORTH</span>
</div>
<div class="flex flex-col col-span-2 mt-stack-sm">
<span class="font-label-caps text-label-caps text-on-surface opacity-60 mb-unit">RAW DATA</span>
<span class="font-code-data text-code-data text-primary opacity-50 break-all">ERR_0x9928_UNVERIFIED_HASH_SIGNATURE</span>
</div>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-stack-md pt-stack-sm">
<button class="w-full py-4 bg-primary text-on-primary font-label-caps text-label-caps uppercase tracking-widest hover:bg-on-primary hover:text-primary transition-colors duration-150 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
                        Back to Scanner
                    </button>
<button class="w-full py-4 bg-transparent border border-primary text-primary font-label-caps text-label-caps uppercase tracking-widest hover:bg-primary hover:text-on-primary transition-colors duration-150 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="support_agent">support_agent</span>
                        Contact Box Office
                    </button>
</div>
</div>

<div class="absolute inset-0 border-4 border-primary pointer-events-none z-20"></div>
</div>
