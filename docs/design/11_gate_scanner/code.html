<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EliteTickets Gate Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:wght@400;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#4e4633",
                        "on-secondary-container": "#b7b5b1",
                        "on-secondary-fixed-variant": "#474744",
                        "on-tertiary-fixed": "#001f24",
                        "on-secondary-fixed": "#1c1c1a",
                        "surface-container": "#1e2020",
                        "primary": "#ffebc0",
                        "error": "#ffb4ab",
                        "surface": "#121414",
                        "surface-bright": "#37393a",
                        "secondary-fixed-dim": "#c8c6c3",
                        "primary-fixed": "#ffdf92",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#121414",
                        "on-surface-variant": "#d2c5ac",
                        "surface-container-lowest": "#0c0f0f",
                        "ticket-paper": "#F5F7F8",
                        "on-primary-container": "#6f5600",
                        "primary-container": "#feca27",
                        "inverse-on-surface": "#2f3131",
                        "secondary-container": "#474744",
                        "surface-container-highest": "#333535",
                        "primary-fixed-dim": "#f3c019",
                        "tertiary-fixed-dim": "#00daf2",
                        "on-tertiary-fixed-variant": "#004f58",
                        "error-container": "#93000a",
                        "tertiary": "#c2f5ff",
                        "background": "#121414",
                        "surface-container-low": "#1a1c1c",
                        "on-tertiary-container": "#00626e",
                        "on-primary": "#3e2e00",
                        "deep-navy": "#1A2337",
                        "secondary": "#c8c6c3",
                        "inverse-primary": "#755b00",
                        "on-surface": "#e2e2e2",
                        "outline": "#9b9079",
                        "on-secondary": "#31302e",
                        "ticket-void": "#FF3B30",
                        "surface-container-high": "#282a2b",
                        "on-tertiary": "#00363d",
                        "on-primary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#594400",
                        "surface-variant": "#333535",
                        "ticket-valid": "#34C759",
                        "on-background": "#e2e2e2",
                        "on-error": "#690005",
                        "surface-tint": "#f3c019",
                        "tertiary-container": "#00e5fe",
                        "secondary-fixed": "#e5e2de",
                        "inverse-surface": "#e2e2e2",
                        "tertiary-fixed": "#9af0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "margin-desktop": "64px",
                        "ticket-perforation": "12px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "subheading": ["Libre Franklin"],
                        "body-md": ["Libre Franklin"],
                        "headline-lg": ["Anton"],
                        "label-caps": ["Space Mono"],
                        "headline-lg-mobile": ["Anton"],
                        "data-mono": ["Space Mono"],
                        "display-xl": ["Anton"]
                    },
                    "fontSize": {
                        "subheading": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "0.02em", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["36px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "400" }],
                        "display-xl": ["84px", { "lineHeight": "84px", "letterSpacing": "-0.02em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .scanner-frame {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
        }
        .scan-line {
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 z-50 bg-background border-b-2 border-outline-variant flat no shadows">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined" data-icon="confirmation_number">confirmation_number</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile uppercase tracking-tighter">EliteTickets</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-16 flex flex-col relative">
<!-- Event Selector -->
<div class="px-margin-mobile py-4 z-40 relative bg-surface border-b border-outline-variant">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-1">ACTIVE EVENT GATE</label>
<div class="relative">
<select class="w-full bg-surface-container border-2 border-outline-variant rounded-none py-3 pl-4 pr-10 text-on-surface font-subheading text-subheading appearance-none focus:outline-none focus:border-primary focus:ring-0">
<option>Neon Nights Festival - Main Gate</option>
<option>Neon Nights Festival - VIP Entrance</option>
<option>Underground Sound - Gate A</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-primary">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
<div class="flex justify-between mt-2 font-data-mono text-data-mono text-on-surface-variant">
<span>Scanned: <span class="text-primary font-bold">1,204</span></span>
<span>Remaining: <span class="text-on-surface font-bold">8,796</span></span>
</div>
</div>
<!-- Camera Viewfinder Area -->
<div class="flex-grow relative bg-black flex items-center justify-center overflow-hidden">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 bg-surface-container-lowest" data-alt="A slightly blurred view of a crowd entering a dark concert venue, seen from the perspective of a gate scanner. High contrast brutalist style, deep shadows with sharp, vivid yellow and white lighting accents indicating a high-stakes, premium live event atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA_IF3oT3GOuB38yIP7xDOLF27C_b8ssRRHJLzfoZZCZBklmVdlox-JI9jjabFp1fN4wErB6KIaoPiuMPuae8SmuLiAqG3cecccdA6glOBP211zcwkd4PmGeRAsqivlhtKBbIOM3p0DadXRTLEmfCib9hz5QpXnAq96OoI-F9XCWgeHxSxwogD9sahuiG5NfLoSQZdZr1gCenJOEJAQlew3KVbESvQUpsxEFXcsZ-zi9oINwznq')"></div>
<!-- Scanner Reticle -->
<div class="relative w-64 h-64 border-4 border-primary/30 z-10 scanner-frame">
<!-- Corner Accents -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary"></div>
<!-- Animated Scan Line -->
<div class="absolute left-0 right-0 h-1 bg-primary/80 scan-line shadow-[0_0_8px_rgba(254,202,39,0.8)]"></div>
<div class="absolute -bottom-8 left-0 right-0 text-center font-label-caps text-label-caps text-primary tracking-widest uppercase">
                    Align QR within frame
                </div>
</div>
</div>
<!-- Manual Entry & Controls -->
<div class="bg-surface border-t-2 border-outline-variant p-margin-mobile flex flex-col gap-4 z-40 relative">
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">MANUAL OVERRIDE</label>
<div class="flex gap-2">
<input class="flex-grow bg-surface-container-low border-b-2 border-outline-variant focus:border-primary text-on-surface font-data-mono text-data-mono px-3 py-4 focus:outline-none placeholder:text-on-surface-variant/50 uppercase" placeholder="ENTER TICKET ID..." type="text"/>
<button class="bg-primary-container text-black font-label-caps text-label-caps px-6 py-4 font-bold border-2 border-primary-container active:bg-primary-fixed-dim transition-colors">VERIFY</button>
</div>
</div>
<!-- Quick Actions -->
<div class="grid grid-cols-2 gap-4 mt-2">
<button class="flex items-center justify-center gap-2 border-2 border-outline-variant text-on-surface py-3 font-label-caps text-label-caps active:bg-surface-container hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-lg">flashlight_on</span>
                    FLASHLIGHT
                </button>
<button class="flex items-center justify-center gap-2 border-2 border-outline-variant text-on-surface py-3 font-label-caps text-label-caps active:bg-surface-container hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-lg">history</span>
                    HISTORY
                </button>
</div>
</div>
</main>
<!-- Suppressed BottomNavBar and SideDrawer as this is a focused, task-based transactional screen (scanner) without global navigation intents -->
</body></html>
