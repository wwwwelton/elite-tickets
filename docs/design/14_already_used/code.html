<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EliteTickets - Gate Scan Warning</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:wght@400;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#4e4633",
                        "on-secondary-container": "#b7b5b1",
                        "on-secondary-fixed-variant": "#474744",
                        "on-tertiary-fixed": "#001f24",
                        "on-secondary-fixed": "#1c1c1a",
                        "surface-container": "#1e2020",
                        "primary": "#ffebc0",
                        "error": "#ffb4ab",
                        "surface": "#121414",
                        "surface-bright": "#37393a",
                        "secondary-fixed-dim": "#c8c6c3",
                        "primary-fixed": "#ffdf92",
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#121414",
                        "on-surface-variant": "#d2c5ac",
                        "surface-container-lowest": "#0c0f0f",
                        "ticket-paper": "#F5F7F8",
                        "on-primary-container": "#6f5600",
                        "primary-container": "#feca27",
                        "inverse-on-surface": "#2f3131",
                        "secondary-container": "#474744",
                        "surface-container-highest": "#333535",
                        "primary-fixed-dim": "#f3c019",
                        "tertiary-fixed-dim": "#00daf2",
                        "on-tertiary-fixed-variant": "#004f58",
                        "error-container": "#93000a",
                        "tertiary": "#c2f5ff",
                        "background": "#121414",
                        "surface-container-low": "#1a1c1c",
                        "on-tertiary-container": "#00626e",
                        "on-primary": "#3e2e00",
                        "deep-navy": "#1A2337",
                        "secondary": "#c8c6c3",
                        "inverse-primary": "#755b00",
                        "on-surface": "#e2e2e2",
                        "outline": "#9b9079",
                        "on-secondary": "#31302e",
                        "ticket-void": "#FF3B30",
                        "surface-container-high": "#282a2b",
                        "on-tertiary": "#00363d",
                        "on-primary-fixed": "#241a00",
                        "on-primary-fixed-variant": "#594400",
                        "surface-variant": "#333535",
                        "ticket-valid": "#34C759",
                        "on-background": "#e2e2e2",
                        "on-error": "#690005",
                        "surface-tint": "#f3c019",
                        "tertiary-container": "#00e5fe",
                        "secondary-fixed": "#e5e2de",
                        "inverse-surface": "#e2e2e2",
                        "tertiary-fixed": "#9af0ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "margin-desktop": "64px",
                        "ticket-perforation": "12px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "subheading": ["Libre Franklin"],
                        "body-md": ["Libre Franklin"],
                        "headline-lg": ["Anton"],
                        "label-caps": ["Space Mono"],
                        "headline-lg-mobile": ["Anton"],
                        "data-mono": ["Space Mono"],
                        "display-xl": ["Anton"]
                    },
                    fontSize: {
                        "subheading": ["20px", { lineHeight: "28px", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg": ["48px", { lineHeight: "52px", letterSpacing: "0.02em", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "16px", fontWeight: "700" }],
                        "headline-lg-mobile": ["36px", { lineHeight: "40px", fontWeight: "400" }],
                        "data-mono": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "400" }],
                        "display-xl": ["84px", { lineHeight: "84px", letterSpacing: "-0.02em", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .ticket-cutout-top {
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
        }
        .ticket-cutout-bottom {
            clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }
        .bg-warning-stripe {
            background-image: repeating-linear-gradient(
                45deg,
                #feca27,
                #feca27 10px,
                #0c0f0f 10px,
                #0c0f0f 20px
            );
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-4">
<!-- Full Screen Warning Container -->
<main class="w-full max-w-md bg-surface-container-lowest border-2 border-primary-container relative flex flex-col h-[85vh] shadow-[0_0_50px_rgba(254,202,39,0.15)] overflow-hidden">
<!-- Header Stripe -->
<div class="h-4 w-full bg-warning-stripe shrink-0"></div>
<!-- Main Warning Content -->
<div class="flex-grow flex flex-col items-center justify-center p-6 text-center z-10">
<div class="mb-8">
<span class="material-symbols-outlined text-[80px] text-primary-container" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
</div>
<h1 class="font-display-xl text-display-xl text-primary-container uppercase leading-none mb-2 tracking-tighter w-full break-words">
                ALREADY<br/>USED
            </h1>
<p class="font-subheading text-subheading text-on-surface-variant mt-4 uppercase">
                Access Denied
            </p>
<!-- Scan Details Stencil Box -->
<div class="mt-12 border border-outline-variant p-4 w-full bg-surface-container-low text-left relative before:content-[''] before:absolute before:-top-3 before:left-4 before:w-16 before:h-2 before:bg-background before:border-b-2 before:border-background">
<span class="font-label-caps text-label-caps text-outline absolute -top-[10px] left-5 bg-surface-container-low px-1">SCAN LOG</span>
<div class="flex justify-between items-end mb-4 border-b border-dashed border-outline-variant pb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">PREVIOUS SCAN</span>
<span class="font-data-mono text-data-mono text-primary">OCT 24, 19:42:15</span>
</div>
<div class="flex justify-between items-end mb-4 border-b border-dashed border-outline-variant pb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">GATE / TERMINAL</span>
<span class="font-data-mono text-data-mono text-on-surface">NORTH-G4-T02</span>
</div>
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant">TICKET ID</span>
<span class="font-data-mono text-data-mono text-on-surface">ELT-992-XKA</span>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="p-6 shrink-0 w-full bg-surface-container border-t-2 border-primary-container relative z-10">
<button aria-label="Dismiss Warning" class="w-full bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile uppercase py-4 transition-colors hover:bg-primary active:bg-primary-fixed-dim">
                DISMISS
            </button>
</div>
<!-- Background Graphic Elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-10 flex items-center justify-center">
<span class="font-display-xl text-[200px] text-primary-container -rotate-45 leading-none select-none">VOID</span>
</div>
</main>
</body></html>
